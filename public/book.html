<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book an Appointment</title>
  <style>
    body { font-family: 'Noto Sans','Noto Sans Tamil','Noto Sans Devanagari',system-ui,Arial,sans-serif;
           background:#f4f8fa; color:#2c3e50; margin:0; }
    .card { max-width:440px; margin:40px auto; background:#fff; padding:28px;
            border-radius:10px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
    h2 { margin-top:0; color:#0f5c75; }
    label { display:block; margin-top:14px; font-weight:600; }
    input[type=text], input[type=email], input[type=date], select {
      width:100%; padding:11px; margin-top:6px; box-sizing:border-box;
      border:1px solid #c9d6dc; border-radius:6px; font-size:15px; }
    .consent { font-weight:400; display:flex; gap:8px; align-items:flex-start; }
    small { color:#667b86; display:block; margin-top:6px; }
    button { margin-top:20px; padding:13px 20px; width:100%; background:#0f5c75;
             color:#fff; border:0; border-radius:6px; font-size:16px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    #msg { margin-top:16px; }
    .ok { color:#1a7f37; } .err { color:#c62828; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Book your appointment</h2>
    <form id="form">
      <label>Full name
        <input type="text" id="name" autocomplete="name" required />
      </label>

      <label>Email address
        <input type="email" id="email" autocomplete="email" required />
      </label>

      <label>Preferred language
        <select id="language">
          <option value="en">English</option>
          <option value="ta">தமிழ்</option>
          <option value="hi">हिन्दी</option>
        </select>
      </label>

      <label>Appointment date
        <input type="date" id="date" required />
      </label>

      <label class="consent">
        <input type="checkbox" id="consent" required />
        <span>I agree to receive appointment reminders by email.</span>
      </label>
      <small>We only use your details to remind you about your appointment.
        You can stop reminders at any time using the link in any email.</small>

      <button type="submit" id="btn">Book appointment</button>
    </form>
    <div id="msg" aria-live="polite"></div>
  </div>

  <!-- 1. EmailJS library (must come first) -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <!-- 2. Your code -->
  <script>
    // ===== REPLACE THESE 5 VALUES =====
    const EMAILJS_PUBLIC_KEY  = "YOUR_PUBLIC_KEY";
    const EMAILJS_SERVICE_ID  = "YOUR_SERVICE_ID";
    const EMAILJS_TEMPLATE_ID = "YOUR_TEMPLATE_ID";
    const CLINIC_NAME  = "My Clinic";
    const CLINIC_PHONE = "+91XXXXXXXXXX";
    // ==================================

    emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

    const TEXT = {
      en: {
        header_tagline: "Appointment care and reminders",
        greeting: "Dear",
        date_label: "Your appointment date",
        contact_line: "If you have any questions, please call us at",
        closing: "With warm regards,",
        opt_out_text: "If you no longer wish to receive these reminders,",
        opt_out_link_label: "click here to stop them.",
        auto_note: "This is an automated message. Please do not reply directly.",
        booking_confirmation: {
          subject: "Your appointment is confirmed",
          line1: "Thank you for booking with us. Your appointment has been confirmed.",
          line2: "If a lab test is needed before your visit, we will kindly remind you in advance."
        }
      },
      ta: {
        header_tagline: "சந்திப்பு பராமரிப்பு மற்றும் நினைவூட்டல்கள்",
        greeting: "அன்புள்ள",
        date_label: "உங்கள் சந்திப்பு தேதி",
        contact_line: "ஏதேனும் கேள்விகள் இருந்தால், தயவுசெய்து அழைக்கவும்:",
        closing: "அன்புடன்,",
        opt_out_text: "இந்த நினைவூட்டல்கள் இனி வேண்டாம் எனில்,",
        opt_out_link_label: "நிறுத்த இங்கே கிளிக் செய்யவும்.",
        auto_note: "இது தானியங்கி செய்தி. தயவுசெய்து நேரடியாகப் பதிலளிக்க வேண்டாம்.",
        booking_confirmation: {
          subject: "உங்கள் சந்திப்பு உறுதி செய்யப்பட்டது",
          line1: "முன்பதிவு செய்ததற்கு நன்றி. உங்கள் சந்திப்பு உறுதி செய்யப்பட்டுள்ளது.",
          line2: "வருகைக்கு முன் ஏதேனும் ஆய்வகப் பரிசோதனை தேவைப்பட்டால், முன்கூட்டியே அன்புடன் நினைவூட்டுவோம்."
        }
      },
      hi: {
        header_tagline: "अपॉइंटमेंट देखभाल और रिमाइंडर",
        greeting: "प्रिय",
        date_label: "आपके अपॉइंटमेंट की तारीख",
        contact_line: "कोई प्रश्न हो तो कृपया कॉल करें:",
        closing: "सादर,",
        opt_out_text: "यदि आप ये रिमाइंडर अब नहीं चाहते,",
        opt_out_link_label: "बंद करने के लिए यहाँ क्लिक करें।",
        auto_note: "यह एक स्वचालित संदेश है। कृपया सीधे उत्तर न दें।",
        booking_confirmation: {
          subject: "आपका अपॉइंटमेंट पक्का हो गया है",
          line1: "बुकिंग करने के लिए धन्यवाद। आपका अपॉइंटमेंट पक्का हो गया है।",
          line2: "यदि विज़िट से पहले कोई लैब जाँच आवश्यक हुई, तो हम पहले से विनम्रतापूर्वक याद दिलाएँगे।"
        }
      }
    };

    function formatDate(isoDate) {            // 2026-10-15 -> 15/10/2026
      const [y, m, d] = isoDate.split("-");
      return `${d}/${m}/${y}`;
    }

    function sendEmail(patient, scenario) {
      const lang = TEXT[patient.language] ? patient.language : "en";
      const t = TEXT[lang];
      const s = t[scenario];

      return emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
        to_email: patient.email,
        to_name: patient.name,
        subject: s.subject,
        clinic_name: CLINIC_NAME,
        clinic_phone: CLINIC_PHONE,
        header_tagline: t.header_tagline,
        greeting: t.greeting,
        date_label: t.date_label,
        appointment_date: formatDate(patient.date),
        message_line_1: s.line1,
        message_line_2: s.line2,
        contact_line: t.contact_line,
        closing: t.closing,
        opt_out_text: t.opt_out_text,
        opt_out_link: window.location.origin + "/opt-out.html",
        opt_out_link_label: t.opt_out_link_label,
        auto_note: t.auto_note
      });
    }

    // ----- Form handling -----
    const form = document.getElementById("form");
    const btn  = document.getElementById("btn");
    const msg  = document.getElementById("msg");

    // Don't allow past dates
    document.getElementById("date").min = new Date().toISOString().split("T")[0];

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      msg.className = "";
      msg.textContent = "Please wait...";

      const patient = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        language: document.getElementById("language").value,
        date: document.getElementById("date").value
      };

      try {
        await sendEmail(patient, "booking_confirmation");
        msg.className = "ok";
        msg.textContent = "Thank you, your appointment is booked. A confirmation email is on its way. If you do not see it, please check your spam folder.";
        form.reset();
      } catch (err) {
        console.error(err);
        msg.className = "err";
        msg.textContent = "Something went wrong on our side. Please try again in a few minutes.";
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
