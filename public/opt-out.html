<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opt-Out — CareFlow Reminders</title>
  <style>
    body { font-family: 'Noto Sans',system-ui,Arial,sans-serif; background:#f4f8fa; color:#2c3e50; margin:0; }
    .card { max-width:440px; margin:60px auto; background:#fff; padding:32px; border-radius:10px; box-shadow:0 2px 12px rgba(0,0,0,.08); text-align:center; }
    h2 { color:#0f5c75; margin-top:0; }
    p { color:#556b78; line-height:1.6; font-size:15px; }
    .btn { display:inline-block; margin-top:20px; padding:12px 24px; background:#0f5c75; color:#fff; text-decoration:none; border-radius:6px; font-weight:600; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Email Reminders Unsubscribed</h2>
    <p>You have successfully opted out of automated appointment reminders from CareFlow.</p>

  </div>

</html>
